[package]
name = "paddock-gate"
version = "1.12.3"
description = "PADDOCK GATE（会場の発表PC用）"
authors = ["SEVENTHWELL"]
edition = "2021"
publish = false

[[bin]]
name = "PADDOCK_GATE"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
