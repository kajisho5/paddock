# PADDOCK GATE（Tauri 版）の Windows 用ビルドと起動確認
#   push（GATE・共通部分・Tauri 版を変えたとき）／ Actions → gate-windows → Run workflow
#   できた zip は Artifacts（PADDOCK_GATE_Windows）に出る
name: gate-windows

on:
  push:
    branches: [main]
    paths:
      - "sw_nas_watch.py"
      - "sw_nas_operator.py"
      - "build_app.py"
      - "build_protected.py"
      - "build_operator.py"
      - "exe/**"
      - "tauri/gate/**"
      - ".github/workflows/gate-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_EMBED: "3.13.16"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 版がそろっているか
        shell: bash
        run: |
          set -euo pipefail
          a=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' sw_nas_operator.py | head -n1)
          b=$(sed -n 's/^version = "\(.*\)"/\1/p' tauri/gate/Cargo.toml | head -n1)
          c=$(python -c "import json;print(json.load(open('tauri/gate/tauri.conf.json'))['version'])")
          echo "GATE $a / Cargo $b / tauri.conf $c"
          [ "$a" = "$b" ] && [ "$a" = "$c" ] || { echo "::error::版がそろっていません（sw_nas_operator.py・tauri/gate/Cargo.toml・tauri.conf.json）"; exit 1; }
          echo "GATE_VERSION=$a" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/gate/target
          key: tauri-gate-${{ runner.os }}-${{ hashFiles('tauri/gate/Cargo.lock') }}

      - name: Tauri 版の窓をビルド
        working-directory: tauri/gate
        run: cargo build --release --locked

      - name: 同梱の Python と配布 zip
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet ziglang
          curl -fsSL -o embed.zip "https://www.python.org/ftp/python/${PY_EMBED}/python-${PY_EMBED}-embed-amd64.zip"
          PADDOCK_SHELL="tauri/gate/target/release/PADDOCK_GATE.exe" python build_operator.py embed.zip dist
          ls -la dist

      - name: PowerPoint を開く命令（PowerShell）の文法チェック
        shell: pwsh
        run: |
          python dev/extract_ppt_ps.py ppt.ps1
          $err = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ppt.ps1), [ref]$null, [ref]$err)
          if ($err.Count) { $err | ForEach-Object { Write-Host "::error::$_" }; exit 1 } else { Write-Host "OK 文法" }
          $env:SWNAS_PPTREQ = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('{"path":"C:\\nope\\x.pptx","show":true,"ro":false}'))
          $out = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ppt.ps1
          Write-Host "PowerPoint の無い PC での結果: $out"
          if ($out -notmatch '"err"') { Write-Host "::error::PowerPoint の無い PC でエラーを返さない"; exit 1 }

      - name: 起動の確認
        shell: pwsh
        run: ./tauri/gate/ci/smoke.ps1 -Zip "dist/PADDOCK_GATE_v${env:GATE_VERSION}_Windows.zip" -Out smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PADDOCK_GATE_Windows
          path: dist/PADDOCK_GATE_v*_Windows.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-windows-smoke
          path: smoke/
          retention-days: 7

  # main に入った版がまだ出ていなければ、Releases に zip を置く（タグ gate-v<版>）
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PADDOCK_GATE_Windows
          path: dist
      - name: Releases に出す
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' sw_nas_operator.py | head -n1)
          tag="gate-v$v"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag はもう出ています"; exit 0; fi
          notes=$(awk -v v="$v" '$0 ~ "^- \\*\\*v"v"\\*\\*" {f=1} f && /^- \*\*v/ && $0 !~ "v"v {exit} f' README_OPERATOR.md)
          gh release create "$tag" dist/PADDOCK_GATE_v${v}_Windows.zip \
            --title "PADDOCK GATE v$v（Windows）" --target "$GITHUB_SHA" \
            --notes "${notes:-PADDOCK GATE v$v}"$'\n\n'"ダウンロード：下の PADDOCK_GATE_v${v}_Windows.zip を保存し、「すべて展開」してから PADDOCK_GATE.exe を起動してください。"$'\n\n'"有償ソフトウェアです。使用には SEVENTHWELL との有償の使用許諾契約が必要です（無償での使用はできません。LICENSE.txt を参照、お問い合わせは info@seventh-well.com）。"
